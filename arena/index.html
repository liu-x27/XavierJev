<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XavierJev · arena</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2309090b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23c4f24c'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%2309090b'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before the first paint, so a dark-theme user
      // never sees a flash of paper. Same rule as initialTheme() in lib/theme.ts.
      (() => {
        const saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          saved === "instrument" || saved === "editorial" || saved === "aurora"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "instrument" : "editorial";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
