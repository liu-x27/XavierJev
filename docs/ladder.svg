<title id="t">The gate on judges of different sizes</title>
<desc id="d">llama3.2:1b: 45 ms, 2 of 41 clearable with none let through, self-check unsafe; llama3.2:3b: 66 ms, 17 of 41 clearable with none let through, self-check not as measured; qwen2.5:3b: 84 ms, 2 of 41 clearable with none let through, self-check unsafe; llama3.1:8b: 97 ms, 39 of 41 clearable with none let through, self-check as measured; yi:9b: 123 ms, 0 of 41 clearable with none let through, self-check unsafe; glm4:9b cannot judge.</desc>
<rect width="640" height="366" rx="10" fill="#0f1013"/>
