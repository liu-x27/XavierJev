name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The version this lockfile was made with: a newer npm resolves one optional peer differently.
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The gate's dev set on the offline allow-list: no model needed, and any false allow fails the run.
      - run: npm run eval:risk-gate
